name: Build and Verify Plugin

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build plugin and verify structure
        run: ./gradlew buildPlugin verifyPluginStructure --no-daemon

      - name: Run IntelliJ Plugin Verifier
        run: ./gradlew verifyPlugin --no-daemon

      - name: Upload plugin distribution
        uses: actions/upload-artifact@v4
        with:
          name: flowtags-plugin-distribution
          path: build/distributions/*.zip
          if-no-files-found: error
